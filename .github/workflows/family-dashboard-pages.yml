name: Deploy YOUPI Family Console to GitHub Pages

on:
  push:
    branches:
      - feature/family-admin-dashboard
    paths:
      - "apps/family-dashboard/**"
      - ".github/workflows/family-dashboard-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: family-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dashboard site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/family-dashboard

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
